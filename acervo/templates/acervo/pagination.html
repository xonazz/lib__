{% if is_paginated %}
<div class="pag">
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">« anterior</a>{% endif %}
  Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">próxima »</a>{% endif %}
</div>
{% endif %}
